name: Sentracore APP2 CI/CD

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

concurrency:
  group: sentracore-app2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check backend syntax
        run: |
          node --check backend/server.mjs
          node --check backend/ai/geminiAdapter.mjs
          node --check backend/pipelines/auditPipeline.mjs
          node --check backend/runtime/operationalTelemetry.mjs

      - name: Run backend smoke test
        run: npm run test:backend-smoke
        env:
          BACKEND_PORT: 8787
          ADMIN_BOOTSTRAP_TOKEN: demo-admin-token
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f docker-compose.production.yml build

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          test -n "${{ secrets.APP2_SSH_HOST }}"
          test -n "${{ secrets.APP2_SSH_USER }}"
          test -n "${{ secrets.APP2_SSH_KEY }}"
          test -n "${{ secrets.APP2_DEPLOY_PATH }}"

      - name: Install SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.APP2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.APP2_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        shell: bash
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude ".env" \
            --exclude ".env.production" \
            ./ "${{ secrets.APP2_SSH_USER }}@${{ secrets.APP2_SSH_HOST }}:${{ secrets.APP2_DEPLOY_PATH }}/"

      - name: Write production env on server
        shell: bash
        run: |
          ssh "${{ secrets.APP2_SSH_USER }}@${{ secrets.APP2_SSH_HOST }}" "cat > '${{ secrets.APP2_DEPLOY_PATH }}/.env.production' <<'EOF'
          SERVICE_NAME=sentracore-audit-backend
          NODE_ENV=production
          PUBLIC_APP_URL=${{ secrets.APP2_PUBLIC_APP_URL }}
          BACKEND_API_URL=${{ secrets.APP2_BACKEND_API_URL }}
          CORE_BACKEND_URL=${{ secrets.APP1_CORE_BACKEND_URL }}
          ADMIN_BOOTSTRAP_TOKEN=${{ secrets.ADMIN_BOOTSTRAP_TOKEN }}
          ALLOWED_ORIGINS=${{ secrets.APP2_ALLOWED_ORIGINS }}
          POSTGRES_URL=${{ secrets.APP2_POSTGRES_URL }}
          POSTGRES_DB=${{ secrets.APP2_POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.APP2_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.APP2_POSTGRES_PASSWORD }}
          REDIS_URL=${{ secrets.APP2_REDIS_URL }}
          AI_PROVIDER=gemini
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_API_BASE=https://generativelanguage.googleapis.com/v1beta
          ETHEREUM_RPC_URL=${{ secrets.ETHEREUM_RPC_URL }}
          SOLANA_RPC_URL=${{ secrets.SOLANA_RPC_URL }}
          BNB_RPC_URL=${{ secrets.BNB_RPC_URL }}
          POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
          STORAGE_BUCKET_URL=${{ secrets.STORAGE_BUCKET_URL }}
          STORAGE_ACCESS_KEY=${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY=${{ secrets.STORAGE_SECRET_KEY }}
          IPFS_GATEWAY_URL=${{ secrets.IPFS_GATEWAY_URL }}
          IPFS_API_TOKEN=${{ secrets.IPFS_API_TOKEN }}
          EOF"

      - name: Start APP2 on server
        shell: bash
        run: |
          ssh "${{ secrets.APP2_SSH_USER }}@${{ secrets.APP2_SSH_HOST }}" \
            "cd '${{ secrets.APP2_DEPLOY_PATH }}' && docker compose -f docker-compose.production.yml --env-file .env.production up -d --build"
