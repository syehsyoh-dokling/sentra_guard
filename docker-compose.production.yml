services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.production
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8787}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:8080}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://127.0.0.1:8787}
      CORE_BACKEND_URL: ${CORE_BACKEND_URL:-http://host.docker.internal:4000}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-demo-admin-token}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://sentracore:replace-with-strong-password@postgres:5432/sentracore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  audit-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.production
    command: ["node", "backend/workers/auditWorker.mjs"]
    environment:
      BACKEND_API_URL: ${INTERNAL_BACKEND_API_URL:-http://backend:8787}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://sentracore:replace-with-strong-password@postgres:5432/sentracore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_ID: ${WORKER_ID:-docker-node-audit-worker-1}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentracore}
      POSTGRES_USER: ${POSTGRES_USER:-sentracore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-strong-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentracore -d sentracore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
